# ATLAS master configuration
# Every tunable parameter of the project lives here. No magic numbers in code.

general:
  base_currency: USD
  start_date: "2010-01-01"        # earliest data pulled
  is_end_date: "2021-12-31"       # in-sample boundary (design & tuning)
  oos_start_date: "2022-01-01"    # out-of-sample walk-forward begins here
  random_seed: 42

universe:
  candidate_pool_file: null        # optional CSV of candidate tickers; null = built-in pool
  min_history_years: 8
  min_avg_dollar_volume: 5_000_000
  max_missing_ratio: 0.05
  correlation_dedup_threshold: 0.95
  n_asset_clusters: 8              # K-Means clusters for de-duplication (S6)
  rescreen_frequency: quarterly
  max_universe_size: 40

rebalance:
  frequency: weekly                # decision Friday close, execute next trading day
  transaction_cost_bps: 10
  max_weekly_turnover: 0.02        # S4-convention risk-control POLICY, not a
                                    # tunable parameter: stage 9's stability-
                                    # penalized grid froze this at 0.01 with
                                    # no_trade_band also 0.01 (band == cap
                                    # collapses every rebalance to "trade
                                    # exactly 1% or freeze," throttling every
                                    # upstream signal). Stage 11's ablation
                                    # confirmed relaxing back to 2% raises OOS
                                    # Sharpe 0.806 -> 0.875 with no drawdown
                                    # cost (REVIEW.md 2.1/6.3): a stability
                                    # criterion applied to the risk cap itself
                                    # will always buy stability with paralysis,
                                    # so the cap is set by policy, not the grid.
  no_trade_band: 0.005              # strictly below the cap (S4 convention),
                                    # so "trade toward target" and "freeze"
                                    # remain distinct regimes

constraints:
  long_only: true
  per_asset_cap: 0.20
  per_class_cap: 0.60
  tracking_error_budget: null      # optional TE budget vs benchmark; null = off

modules:                           # ablation on/off flags
  regime_view: true                # V1
  meanreversion_view: true         # V2
  technical_view: true             # V3 (price levels; options part live-only)
  sentiment_view: true             # V4
  anomaly_override: true
  execution_timing: true

regimes:
  market_ticker: ACWI               # broad-market proxy the HMM is fit on
  hmm:
    n_states: 3
    features: [returns, rolling_vol]
    vol_window_days: 21             # ~1 trading month, for rolling_vol
    lookback_days: 1260             # ~5Y training window, ~a few regime cycles
    refit: weekly                  # cheap; decode-only also allowed
  kmeans_macro:
    k: 4
    refit: fold                    # per walk-forward fold
    fred_series: [UNRATE, CPIAUCSL, INDPRO, T10Y2Y, FEDFUNDS, UMCSENT]
    growth_indicator: INDPRO
    inflation_indicator: CPIAUCSL

anomaly:
  sequence_length: 5
  latent_dim: 2
  hidden_units: 8                  # LSTM encoder/decoder width
  threshold_percentile: 99
  validation_fraction: 0.2         # chronological split, tail = validation
  epochs: 50
  patience: 5                      # early-stopping patience on val_loss
  batch_size: 32
  refit: fold                      # per walk-forward fold (formalized stage 9)
  refit_frequency_days: 63         # ~1 quarter; stage-4 stand-in for the
                                    # real fold schedule, to keep the OOS
                                    # backtest demo tractable before stage 9
  blend_to_gmv: 1.0                # 1.0 = fully defensive when flagged

meanreversion:
  lookback_days: 20                # frozen by stage 9's IS-only event-study
                                    # grid search (notebook 09), selected on
                                    # cross-fold hit-rate stability over 2010-
                                    # 2021, not peak IS hit rate
  entry_z: 2.0
  exit_z: 0.5                      # position-level hysteresis; not yet
                                    # used by the stateless weekly view
                                    # generator (see meanreversion.py notes)
  max_half_life_days: 60
  adf_lookback_days: 250           # longer than lookback_days: ADF on the
                                    # RAW log-price (not rolling-detrended,
                                    # which induces spurious stationarity)
                                    # needs more data for real power
  adf_pvalue_threshold: 0.05        # stationarity gate on the raw log-price
  vol_filter: true
  vol_filter_percentile: 75         # only trade below this trailing-vol pct
  max_tilt_pp: 0.05                 # max per-asset weight tilt from V2

technicals:
  pivot_order: 5
  sr_cluster_k: 3
  zone_width_bps: 50
  max_view_magnitude: 0.02          # bounded per-asset view cap (S12)
  min_history_days: 60              # floor for a meaningful pivot count
  phase_fraction: 0.5               # execution timing (S12): fraction of
                                     # the desired trade executed this
                                     # rebalance for resistance-flagged
                                     # assets; the rest catches up next
                                     # time the strategy re-targets it
  gamma_proxy_enabled: true        # live only

sentiment:
  sources:                          # RSS feeds (S14); robots.txt is also
    - "https://finance.yahoo.com/news/rssindex"  # checked at request time,
    - "https://www.forbes.com/business/feed/"    # not just pre-vetted here
  lag_days: 1
  score_aggregation: weekly_mean
  max_view_magnitude: 0.01          # small confidence: slow, noisy signal
  n_topics: 3                       # LDA topics for the report
  request_timeout_seconds: 10
  user_agent: "ATLAS-research-bot/0.1 (+https://github.com/sachahuberty/atlas-strategy)"

black_litterman:
  tau: 0.05
  delta: 2.5                        # risk-aversion / equilibrium calibration
                                     # (classic BL default)
  regime_view_magnitude: 0.03        # V1's asset-class-level return tilt
  risk_aversion_for_utility_gate: 5  # which of optimization.risk_aversion_levels
                                     # decides the BL-vs-defensive utility gate
  view_confidence:                 # per view family, relative scale
    regime: 1.0
    meanreversion: 0.8
    technical: 0.5
    sentiment: 0.3

optimization:
  objective: max_sharpe            # on BL posterior returns
  covariance: ledoit_wolf          # shrunk covariance
  risk_aversion_levels: [2, 5, 10] # utility comparison (S1/S3)
  lookback_days: 756               # trailing window for mu/cov, ~3Y (S6 convention)

backtest:
  walk_forward_fold: quarterly       # final OOS fold reporting granularity
  benchmarks: [permanent, sixty_forty, max_sharpe_static, gmv, risk_parity, hrp]

grid_search:
  is_validation_fold: annual         # IS-only tuning fold granularity (S10):
                                     # coarser than the OOS quarterly folds
                                     # so each fold has enough data for a
                                     # meaningful stability read
  stability_penalty: 1.0             # score = mean(fold_metric) -
                                     # penalty * std(fold_metric): rewards
                                     # consistency, not peak performance
  meanreversion:
    lookback_days: [20, 40, 60]
    entry_z: [1.5, 2.0, 2.5]
  turnover:
    no_trade_band: [0.0025, 0.005, 0.01]
    max_weekly_turnover: [0.01, 0.02, 0.04]

risk:
  stress_data_start: "2007-01-01"  # wider window than general.start_date
                                    # (2010): needed to cover the 2008 GFC
  scenarios:                       # acute-crisis windows where every
                                    # universe ticker has real data (S7)
    gfc_2008: ["2008-09-01", "2009-03-31"]     # Lehman collapse to bottom
    covid_2020: ["2020-02-19", "2020-03-23"]   # peak to trough
    rates_2022: ["2022-01-01", "2022-10-31"]   # rate-hike selloff
  sensitivity_shocks:               # one-shot per-asset-class return
                                    # shocks for the sensitivity table (S7)
    equity: [-0.10, -0.20, -0.30]
    fixed_income: [-0.05, -0.10]
    commodity: [-0.20, -0.30]
    cash: [0.0]
  reverse_stress_window_days: 20   # rolling N-day window scanned for the
                                    # worst realized loss (S7)

simulation:
  n_scenarios: 1000
  horizons_years: [1, 2, 4]
  stress_scenarios: [gfc_2008, covid_2020, rates_2022]
