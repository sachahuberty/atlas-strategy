# Regime -> allocation posture mapping.
# IMPORTANT: regimes are identified by PROFILE (vol/return characteristics),
# never by raw cluster index. The profile matcher in regimes.py assigns
# each fitted state to one of these named postures at every re-fit.

postures:
  risk_on:
    profile: { vol: low, mean_return: high }
    # A naive proxy on plain historical mu/cov (PROJECT_STRUCTURE.md
    # 5.1's "views can combine naively" phase). These posture methods
    # are used only by the superseded strategy.regime_switching_
    # strategy (stages 3-7); the current pipeline (strategy.
    # black_litterman_strategy, stage 8+) fuses the real BL posterior
    # instead and never reads allocation_method here.
    allocation_method: max_sharpe
  neutral:
    profile: { vol: medium, mean_return: medium }
    allocation_method: risk_parity
  risk_off:
    profile: { vol: high, mean_return: low }
    allocation_method: gmv_defensive        # GMV tilted to defensive classes
    defensive_class_tilt:                   # additive tilt, applied in
      fixed_income: 0.10                    # allocation.apply_defensive_tilt;
      commodity: 0.10                       # keyed to universe.py's actual
                                             # class buckets (equity,
                                             # fixed_income, commodity,
                                             # real_estate, cash) rather than
                                             # sub-labels ("short_bonds",
                                             # "gold") the screener doesn't
                                             # produce.
