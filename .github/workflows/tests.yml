name: Tests

# Runs the full test suite on every push and pull request to master.
# The whole suite is offline by design (see test_live.py's module
# docstring: "All tests are offline") -- every test that would
# otherwise need the network or FRED_API_KEY mocks the data/strategy
# seam instead (e.g. test_sentiment.py's scrape_headlines tests
# monkeypatch `_robots_allowed` to False so the real `requests.get`
# is never reached). No secret is configured or required here.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e . --no-deps

      - name: Run tests
        run: pytest -q
